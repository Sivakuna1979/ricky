name: WhatsApp Parser Eval

# Runs the 40-case model-quality eval only when the parser, its prompt, or
# its fixtures change — this calls the real Anthropic API (real tokens),
# so it must never run on every PR the way lint/test/build do.
on:
  pull_request:
    paths:
      - 'apps/web/lib/ai/whatsappOrderParser.ts'
      - 'apps/web/eval/whatsapp-order-parser/**'
      - 'apps/web/scripts/eval-whatsapp-parser.ts'
  workflow_dispatch:

jobs:
  eval:
    name: Eval WhatsApp order parser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # No ANTHROPIC_API_KEY repo secret configured yet → the script itself
      # logs that and exits 0 (see scripts/eval-whatsapp-parser.ts). Add the
      # secret in GitHub repo settings to make this check actually run.
      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:whatsapp
